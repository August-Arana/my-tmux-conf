# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# para compartir clipboard entre tmux y nvim 
set-option -g set-clipboard on
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"


# lets unbind that ugly predefine prefix
set -g prefix C-a
bind C-a send-prefix

# Use tmux's own terminfo (supports 24bit color)
set -g default-terminal "tmux-256color"

# Advertise truecolor support to applications inside tmux
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"

# Ensure Neovim and others know tmux supports 24bit
set-option -ga terminal-overrides ",xterm-256color:RGB"
set-option -ga terminal-overrides ",tmux-256color:RGB"

# I prefer to use a long command history
set -g history-limit 999999

# terminal counting from 1 instead of 0
set -g base-index 1


# vim like naigation
bind h C-h select-pane -L
bind j C-j select-pane -D
bind k C-k select-pane -U
bind l C-l select-pane -R

# lets add mouse support!
set -g mouse on

# ez panel splitting
bind / split-window -h -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}' -l 40
bind - split-window -v -c '#{pane_current_path}'
bind _ split-window -v -c '#{pane_current_path}' -l 5
bind c new-window -c '#{pane_current_path}'
bind s display-popup -d '#{pane_current_path}' -E

# Window navigation
bind C-p previous-window
bind C-n next-window

# panel navigation
# bind -n C-h run "(tmux display-message -p '#{pane_current_command}' | grep -iq vi && tmux send-keys C-h) || tmux select-pane -L"
# bind -n C-j run "(tmux display-message -p '#{pane_current_command}' | grep -iq vi && tmux send-keys C-j) || tmux select-pane -D"
# bind -n C-k run "(tmux display-message -p '#{pane_current_command}' | grep -iq vi && tmux send-keys C-k) || tmux select-pane -U"
# bind -n C-l run "(tmux display-message -p '#{pane_current_command}' | grep -iq vi && tmux send-keys C-l) || tmux select-pane -R"

# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# F5 for tmux
bind r source-file ~/.tmux.conf

# flexing and re growing
bind H resize-pane -L 10
bind J resize-pane -D 10
bind K resize-pane -U 10
bind L resize-pane -R 10

# ===========================
# Gruvbox-inspired Status Bar
# ===========================

# Refresh rate
set -g status-interval 1

# General style (background dark, foreground light)
set -g status-bg colour235   # bg0
set -g status-fg colour223   # fg0

# Window renaming
set-window-option -g automatic-rename on
set-option -g allow-rename on

# ---------------------------
# Status Right: CPU, Mem, Net, Time, Date
# ---------------------------
set -g status-right "\
#[fg=colour245,bg=colour235]\
#[bg=colour245,fg=colour16] #(~/.config/my-tmux-conf/scripts/cpu_usage.sh)  \
#[fg=colour66,bg=colour245]\
#[bg=colour66,fg=colour16] #(~/.config/my-tmux-conf/scripts/mem_usage.sh)  \
#[fg=colour214,bg=colour66]\
#[bg=colour214,fg=colour16] #(~/.config/my-tmux-conf/scripts/network_speed.sh) 󰢽 \
#[fg=colour72,bg=colour214]\
#[bg=colour72,fg=colour16] %H:%M:%S  \
#[fg=colour235,bg=colour72]\
#[bg=colour235,fg=colour223] %b %d  "

set -g status-right-length 120

# ---------------------------
# Status Left: Session name
# ---------------------------
set -g status-left "\
#[fg=colour235,bg=colour214]\
#[bg=colour214,fg=colour235,bold] #S \
#[fg=colour214,bg=colour235]"

# ---------------------------
# Window style for inactive windows
# ---------------------------
setw -g window-status-format "\
#[fg=colour235,bg=colour235]\
#[fg=colour245,bg=colour235] #I \
#[fg=white]:\
#[fg=white]#{pane_current_command} \
#[fg=colour235,bg=colour235]"

# ---------------------------
# Window style for active window
# ---------------------------
setw -g window-status-current-format "\
#[fg=colour235,bg=colour214]\
#[bg=colour214,fg=colour235,bold]  #I \
#[fg=colour235]:\
#[fg=colour235,bold]#{pane_current_command} \
#[fg=colour214,bg=colour235]\
#[bg=colour235,fg=colour72]  #(~/.config/my-tmux-conf/scripts/tmux-git-status.sh)\
#[fg=colour235,bg=colour214]\
#[fg=colour214,bg=colour235]"

# Entrar en modo copy con Ctrl + a, y
bind y copy-mode -u

# Pegar el último buffer (Ctrl + a, p)
bind p paste-buffer

# ===========================
# Gruvbox Matching Pane + Window Style
# ===========================

# Colores base (mismo fondo que Gruvbox dark hard)
set -g @bg "#282828"       # fondo principal
set -g @fg "#ebdbb2"       # texto claro
set -g @border_inactive "#3c3836"
set -g @border_active "#fabd2f"

# Fondo uniforme entre panes y neovim
set -g window-style 'bg=#282828'
set -g window-active-style 'bg=#282828'

# Bordes de panel
set -g pane-border-style "fg=#3c3836, bg=#282828"
set -g pane-active-border-style "fg=#fabd2f, bg=#282828"

# Colores de mensajes (cuando tmux muestra algo arriba)
set -g message-style "bg=#fabd2f,fg=#282828,bold"
set -g message-command-style "bg=#83a598,fg=#282828"

# Estilo de modo copy (resaltado)
setw -g mode-style "bg=#83a598,fg=#282828,bold"

run '~/.tmux/plugins/tpm/tpm'




