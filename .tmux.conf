# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# para compartir clipboard entre tmux y nvim
set-option -g set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Mouse drag copies to X11 primary selection (enables middle-click paste)
bind -n MouseDragEnd1Pane send-keys -X copy-pipe "xclip -in -selection primary"


# lets unbind that ugly predefine prefix
set -g prefix C-a
bind C-a send-prefix

# Use tmux's own terminfo (supports 24bit color)
set -g default-terminal "tmux-256color"

# Advertise truecolor support to applications inside tmux
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"

# Ensure Neovim and others know tmux supports 24bit
set-option -ga terminal-overrides ",xterm-256color:RGB"
set-option -ga terminal-overrides ",tmux-256color:RGB"

# I prefer to use a long command history
set -g history-limit 999999

# terminal counting from 1 instead of 0
set -g base-index 1


# vim like naigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# lets add mouse support!
set -g mouse on

# ez panel splitting
bind / split-window -h -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}' -l 40
bind - split-window -v -c '#{pane_current_path}'
bind _ split-window -v -c '#{pane_current_path}' -l 5
bind c new-window -c '#{pane_current_path}'
bind s display-popup -d '#{pane_current_path}' -E

# Window navigation
bind C-p previous-window
bind C-n next-window

# panel navigation
bind -n C-h run "(tmux display-message -p '#{pane_current_command}' | grep -iq vi && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "(tmux display-message -p '#{pane_current_command}' | grep -iq vi && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "(tmux display-message -p '#{pane_current_command}' | grep -iq vi && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "(tmux display-message -p '#{pane_current_command}' | grep -iq vi && tmux send-keys C-l) || tmux select-pane -R"

# F5 for tmux
bind r source-file ~/.tmux.conf

# flexing and re growing
bind H resize-pane -L 10
bind J resize-pane -D 10
bind K resize-pane -U 10
bind L resize-pane -R 10

# ===========================
# Catppuccin Mocha Status Bar
# ===========================

# Refresh rate
set -g status-interval 5

# General style (background dark, foreground light)
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Window renaming
set-window-option -g automatic-rename on
set-option -g allow-rename on

# ---------------------------
# Status Right: CPU, Mem, Net, Time, Date
# ---------------------------
set -g status-right "\
#[fg=#cba6f7,bg=#1e1e2e]\
#[fg=#cba6f7,bg=#cba6f7] #(~/.config/my-tmux-conf/scripts/cpu_usage.sh)  \
#[fg=#89dceb,bg=#cba6f7]\
#[bg=#89dceb,fg=#1e1e2e] #(~/.config/my-tmux-conf/scripts/mem_usage.sh)  \
#[fg=#89b4fa,bg=#89dceb]\
#[bg=#89b4fa,fg=#1e1e2e] #(~/.config/my-tmux-conf/scripts/network_speed.sh) 󰢽 \
#[fg=#a6e3a1,bg=#89b4fa]\
#[bg=#a6e3a1,fg=#1e1e2e] %H:%M:%S  \
#[fg=#1e1e2e,bg=#a6e3a1]\
#[bg=#1e1e2e,fg=#cdd6f4] %b %d  "

set -g status-right-length 120

# ---------------------------
# Status Left: Session name
# ---------------------------
set -g status-left "\
#[fg=#1e1e2e,bg=#89b4fa]\
#[bg=#89b4fa,fg=#1e1e2e,bold] #S \
#[fg=#89b4fa,bg=#1e1e2e]"

# ---------------------------
# Window style for inactive windows
# ---------------------------
setw -g window-status-format "\
#[fg=#1e1e2e,bg=#1e1e2e]\
#[fg=#313244,bg=#1e1e2e] #I \
#[fg=#cdd6f4]:\
#[fg=#cdd6f4]#{pane_current_command} \
#[fg=#1e1e2e,bg=#1e1e2e]"

# ---------------------------
# Window style for active window
# ---------------------------
setw -g window-status-current-format "\
#[fg=#1e1e2e,bg=#89b4fa]\
#[bg=#89b4fa,fg=#1e1e2e,bold]  #I \
#[fg=#1e1e2e]:\
#[fg=#1e1e2e,bold]#{pane_current_command} \
#[fg=#89b4fa,bg=#1e1e2e]\
#[bg=#1e1e2e,fg=#a6e3a1]  #(~/.config/my-tmux-conf/scripts/tmux-git-status.sh)\
#[fg=#1e1e2e,bg=#89b4fa]\
#[fg=#89b4fa,bg=#1e1e2e]"

# Entrar en modo copy con Ctrl + a, y
bind y copy-mode -u

# Pegar el último buffer (Ctrl + a, p)
bind p paste-buffer

# ===========================
# Catppuccin Mocha Pane + Window Style
# ===========================

# Colores base (Catppuccin Mocha)
set -g @bg "#1e1e2e"       # fondo principal
set -g @fg "#cdd6f4"       # texto claro
set -g @border_inactive "#313244"
set -g @border_active "#89b4fa"

# Fondo uniforme entre panes y neovim
set -g window-style 'bg=#1e1e2e'
set -g window-active-style 'bg=#1e1e2e'

# Bordes de panel
#set -g pane-border-style "fg=#313244,bg=#1e1e2e"
set -g pane-border-style "fg=#313244"
#set -g pane-active-border-style "fg=#89b4fa,bg=#1e1e2e"
set -g pane-active-border-style "fg=#89b4fa" 

# Colores de mensajes (cuando tmux muestra algo arriba)
set -g message-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g message-command-style "bg=#89dceb,fg=#1e1e2e"

# Estilo de modo copy (resaltado)
setw -g mode-style "bg=#313244,fg=#cdd6f4,bold"

run '~/.tmux/plugins/tpm/tpm'




